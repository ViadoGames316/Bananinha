<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DuckChainsaw · Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M22 14c-1-5 3-8 5-6M28 12c0-5 4-7 6-5M34 13c1-4 5-5 6-3" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <path d="M18 34c0-12 9-20 20-20 8 0 13 5 13 11 0 4-2 7-5 9l3 8c-8 6-31 8-31-8z" fill="#fff"/>
          <path d="M12 30c-4 0-6 3-4 6 2 2 6 2 8 0" fill="#fff"/>
          <circle cx="34" cy="26" r="2.4" fill="#b85f10"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">DuckChainsaw</div>
        <div class="brand-sub">Studio</div>
      </div>
    </div>
    <button class="nav-btn active" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Início
    </button>
    <button class="nav-btn" data-view="posts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      Posts <span class="pill" id="nav-posts-count">0</span>
    </button>
    <button class="nav-btn" data-view="canvas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h5M8 13h8"/></svg>
      Quadro
    </button>
    <div class="sidebar-foot">
      <span class="sig">DC · 2025</span>
      <button class="theme-toggle" id="themeToggle" title="Alternar tema">☾</button>
    </div>
  </aside>

  <main class="main">
    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="view-head">
        <div>
          <h1 id="greeting">Olá 👋</h1>
          <div class="head-sub" id="greetSub">Aqui está a sua semana.</div>
        </div>
        <button class="btn" onclick="openPostModal()">＋ Novo post</button>
      </div>

      <div class="week-strip" id="weekStrip"></div>

      <div class="stat-row" id="statRow"></div>

      <div class="home-grid">
        <div class="card panel">
          <div class="panel-title">Tarefas da semana <span class="count" id="taskCount">0</span></div>
          <div id="taskList"></div>
          <div class="add-inline">
            <input id="taskInput" placeholder="Adicionar tarefa… (Enter)" onkeydown="if(event.key==='Enter')addTask()">
            <button class="btn ghost" onclick="addTask()">Adicionar</button>
          </div>
        </div>
        <div class="card panel">
          <div class="panel-title">Prazos próximos</div>
          <div id="deadlineList"></div>
        </div>
      </div>
    </section>

    <!-- POSTS -->
    <section class="view" id="view-posts">
      <div class="view-head">
        <div>
          <h1>Posts</h1>
          <div class="head-sub">Seu conteúdo, do rascunho ao publicado.</div>
        </div>
        <button class="btn" onclick="openPostModal()">＋ Novo post</button>
      </div>
      <div class="toolbar">
        <input class="search" id="searchInput" placeholder="Buscar por título, legenda ou tag…" oninput="renderPosts()">
        <div class="chips" id="statusChips"></div>
      </div>
      <div class="posts-grid" id="postsGrid"></div>
    </section>

    <!-- CANVAS -->
    <section class="view" id="view-canvas">
      <div class="view-head">
        <div>
          <h1>Quadro</h1>
          <div class="head-sub">Arraste, organize e apresente. Duplo clique numa nota para editar.</div>
        </div>
      </div>
      <div class="canvas-toolbar">
        <button class="btn" onclick="addCanvasItem('note')">＋ Nota</button>
        <button class="btn ghost" onclick="addCanvasItem('post')">＋ Card de post</button>
        <button class="btn ghost" onclick="addCanvasItem('img')">＋ Imagem</button>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="canvas-surface" id="canvasSurface"></div>
      </div>
      <div class="zoom-ctl">
        <button onclick="zoomBy(-0.1)">−</button>
        <span class="zl" id="zoomLabel">100%</span>
        <button onclick="zoomBy(0.1)">＋</button>
        <button onclick="resetZoom()" title="Redefinir">⟲</button>
      </div>
    </section>
  </main>
</div>

<!-- MODAL -->
<div class="modal-back" id="modalBack">
  <div class="modal">
    <h2 id="modalTitle">Novo post</h2>
    <div class="field">
      <label>Título</label>
      <input id="f-title" placeholder="Ex.: Carrossel — paleta de outono">
    </div>
    <div class="field">
      <label>Legenda</label>
      <textarea id="f-caption" placeholder="Escreva a legenda do post…"></textarea>
    </div>
    <div class="field">
      <label>Status</label>
      <div class="seg" id="f-status"></div>
    </div>
    <div class="field">
      <label>Data alvo</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>Tags (separadas por vírgula)</label>
      <input id="f-tags" placeholder="design, branding, feed">
    </div>
    <div class="field">
      <label>Cor do card</label>
      <div class="seg" id="f-color"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closePostModal()">Cancelar</button>
      <button class="btn" onclick="savePost()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
